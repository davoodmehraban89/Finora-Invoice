<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کالا و خدمت | فینورا</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body><aside class="sidebar"><div class="brand">فینورا<small>مدیریت فروش تا وصول</small></div><a class="nav-link" href="dashboard.html"><span>نمای کلی</span></a><a class="nav-link" href="new-invoice.html"><span>صدور فاکتور</span></a><a class="nav-link" href="invoices.html"><span>فاکتورها</span></a><a class="nav-link " href="customers.html"><span>اشخاص</span></a><a class="nav-link active" href="products.html"><span>کالا و خدمت</span></a><a class="nav-link" href="settings.html"><span>تنظیمات فروشنده</span></a></aside><main class="content"><header class="page-head"><div><div class="eyebrow">اطلاعات پایه</div><h1>کالاها و خدمات</h1><div class="muted">کاتالوگ فروش، قیمت و نرخ مالیات</div></div><button class="btn btn-primary" id="newBtn">+ قلم جدید</button></header><section class="grid grid-2"><div class="card"><div class="field" style="margin-bottom:12px"><label>جست‌وجو</label><input class="input" id="search" placeholder="نام یا کد"></div><div class="table-wrap"><table class="table"><thead><tr><th>کد</th><th>نام</th><th>نوع</th><th>قیمت فروش</th><th>مالیات</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><form class="card" id="form"><h2 id="formTitle">قلم جدید</h2><input id="recordId" type="hidden"><div class="field"><label>نام *</label><input class="input" id="name" required maxlength="160"></div><div class="field"><label>کد</label><input class="input" id="code" maxlength="40"></div><div class="field"><label>نوع</label><select class="select" id="type"><option value="service">خدمت</option><option value="product">کالا</option></select></div><div class="field"><label>واحد</label><input class="input" id="unit" value="عدد"></div><div class="field"><label>قیمت فروش (ریال) *</label><input class="input" id="sellPrice" type="number" min="0" value="0" required></div><div class="field"><label>نرخ مالیات (٪)</label><input class="input" id="taxPercent" type="number" min="0" max="100" value="10"></div><div class="actions" style="margin-top:16px"><button class="btn btn-primary" type="submit">ذخیره</button><button class="btn btn-secondary" type="button" id="cancel">انصراف</button></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/app.js"></script><script>let records=[];function reset(){form.reset();recordId.value='';unit.value='عدد';sellPrice.value=0;taxPercent.value=10;formTitle.textContent='قلم جدید'}function render(){const q=search.value.trim();const data=records.filter(x=>x.active!==false&&(!q||[x.name,x.code].some(v=>(v||'').includes(q))));rows.innerHTML=data.map(x=>`<tr><td>${Finora.escape(x.code)}</td><td><strong>${Finora.escape(x.name)}</strong></td><td>${x.type==='product'?'کالا':'خدمت'}</td><td>${Finora.money(x.sellPrice)}</td><td>${x.taxPercent||0}٪</td><td><button class="btn btn-secondary" onclick="editRecord('${x.id}')">ویرایش</button> <button class="btn btn-danger" onclick="archiveRecord('${x.id}')">بایگانی</button></td></tr>`).join('')||'<tr><td colspan="6" class="empty">کالا یا خدمتی ثبت نشده است.</td></tr>'}window.editRecord=id=>{const x=records.find(r=>r.id===id);recordId.value=x.id;name.value=x.name||'';code.value=x.code||'';type.value=x.type||'service';unit.value=x.unit||'عدد';sellPrice.value=x.sellPrice||0;taxPercent.value=x.taxPercent||0;formTitle.textContent='ویرایش قلم'};window.archiveRecord=async id=>{if(!confirm('این قلم بایگانی شود؟'))return;await Finora.archive('products',id);records=await Finora.list('products',null);render()};form.onsubmit=async e=>{e.preventDefault();await Finora.save('products',{id:recordId.value||undefined,name:name.value.trim(),code:code.value.trim(),type:type.value,unit:unit.value.trim(),sellPrice:Number(sellPrice.value)||0,taxPercent:Number(taxPercent.value)||0,active:true});records=await Finora.list('products',null);reset();render()};newBtn.onclick=reset;cancel.onclick=reset;search.oninput=render;Finora.requireAuth(async()=>{records=await Finora.list('products',null);render()});</script></body></html>
