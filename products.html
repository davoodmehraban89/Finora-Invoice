<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>کالا و خدمت | فینورا</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/mobile.css"></head>
<body><aside class="sidebar"><div class="brand">فینورا<small>مدیریت فروش تا وصول</small></div><a class="nav-link" href="dashboard.html"><span>نمای کلی</span></a><a class="nav-link" href="new-invoice.html"><span>صدور فاکتور</span></a><a class="nav-link" href="invoices.html"><span>فاکتورها</span></a><a class="nav-link" href="customers.html"><span>اشخاص</span></a><a class="nav-link active" href="products.html"><span>کالا و خدمت</span></a><a class="nav-link" href="settings.html"><span>تنظیمات فروشنده</span></a></aside>
<main class="content"><header class="page-head"><div><div class="eyebrow">فروش • کاتالوگ</div><h1>کالا و خدمات</h1><div class="muted">تعریف اقلام قابل استفاده در فاکتور</div></div><button type="button" class="btn btn-primary" id="newProduct">قلم جدید</button></header><div id="pageMessage" class="notice" hidden></div>
<div>
  <section class="card mb-4 flex-between" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 22px;">
    <div class="field" style="width: 100%; max-width: 400px; margin: 0;">
      <input class="input" id="productSearch" placeholder="جست‌وجو بر اساس نام یا کد...">
    </div>
  </section>
  <section class="card">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>نام کالا / خدمت</th>
            <th>کد (SKU)</th>
            <th>نوع</th>
            <th>قیمت فروش (ریال)</th>
            <th style="width: 150px;">عملیات</th>
          </tr>
        </thead>
        <tbody id="productRows"></tbody>
      </table>
    </div>
  </section>
</div>

<dialog id="productDialog">
  <form method="dialog" class="dialog-card" id="productForm">
    <div class="dialog-head">
      <h2 id="formTitle">افزودن کالا یا خدمت جدید</h2>
      <button class="btn btn-secondary" value="cancel" type="button" id="cancelEdit">بستن</button>
    </div>
    <input type="hidden" id="productId">
    <div class="form-grid mb-4">
      <div class="field">
        <label for="productName">نام *</label>
        <input class="input" id="productName" required>
      </div>
      <div class="field">
        <label for="productCode">کد (SKU)</label>
        <input class="input" id="productCode">
      </div>
      <div class="field">
        <label for="productType">نوع</label>
        <select class="select" id="productType">
          <option value="product">کالا</option>
          <option value="service">خدمت</option>
        </select>
      </div>
      <div class="field">
        <label for="productUnit">واحد</label>
        <input class="input" id="productUnit" value="عدد">
      </div>
      <div class="field">
        <label for="productPrice">قیمت فروش (ریال)</label>
        <input class="input" id="productPrice" type="number" min="0" inputmode="numeric">
      </div>
      <div class="field">
        <label for="productTax">مالیات (٪)</label>
        <input class="input" id="productTax" type="number" min="0" max="100" value="10" inputmode="decimal">
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="saveProduct" type="submit" style="width: 100%;">ذخیره کالا یا خدمت</button>
    </div>
  </form>
</dialog></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/app.js"></script>
<script>
(()=>{'use strict';const byId=id=>document.getElementById(id),form=byId('productForm'),idInput=byId('productId'),nameInput=byId('productName'),codeInput=byId('productCode'),typeInput=byId('productType'),unitInput=byId('productUnit'),priceInput=byId('productPrice'),taxInput=byId('productTax'),saveButton=byId('saveProduct'),cancelButton=byId('cancelEdit'),title=byId('formTitle'),rows=byId('productRows'),search=byId('productSearch'),message=byId('pageMessage');let records=[];
function notify(text,error=false){message.hidden=false;message.textContent=text;message.classList.toggle('notice-error',error);if(!error)setTimeout(()=>{message.hidden=true},3500)}
const dialog = byId('productDialog'); function resetForm(){form.reset();idInput.value='';unitInput.value='عدد';taxInput.value='10';title.textContent='افزودن کالا یا خدمت جدید';saveButton.textContent='ذخیره کالا یا خدمت'; dialog.showModal(); nameInput.focus()}
function render(){const term=search.value.trim().toLowerCase(),visible=records.filter(x=>x.active!==false&&(!term||[x.name,x.code].some(v=>String(v||'').toLowerCase().includes(term))));rows.innerHTML=visible.map(x=>`<tr><td>${Finora.escape(x.name)}</td><td>${Finora.escape(x.code||'—')}</td><td>${x.type==='service'?'خدمت':'کالا'}</td><td>${Finora.money(x.sellPrice)}</td><td><div class="actions"><button type="button" class="btn btn-secondary" data-edit="${x.id}">ویرایش</button><button type="button" class="btn btn-danger" data-archive="${x.id}">بایگانی</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">قلم فعالی ثبت نشده است.</td></tr>'}
form.addEventListener('submit',async event=>{event.preventDefault();const productName=nameInput.value.trim();if(!productName){notify('نام کالا یا خدمت را وارد کنید.',true);nameInput.focus();return}saveButton.disabled=true;saveButton.textContent='در حال ذخیره…';try{const saved=await Finora.save('products',{id:idInput.value||undefined,name:productName,code:codeInput.value.trim(),type:typeInput.value,unit:unitInput.value.trim()||'عدد',sellPrice:Number(priceInput.value)||0,taxPercent:Number(taxInput.value)||0,active:true});const index=records.findIndex(x=>x.id===saved.id);index>=0?records.splice(index,1,saved):records.unshift(saved);render();resetForm();dialog.close(); notify('کالا یا خدمت با موفقیت ذخیره شد.')}catch(error){notify(`ذخیره قلم انجام نشد: ${error.message||'خطای نامشخص'}`,true)}finally{saveButton.disabled=false;if(!idInput.value)saveButton.textContent='ذخیره قلم'}});
rows.addEventListener('click',async event=>{const edit=event.target.closest('[data-edit]'),archive=event.target.closest('[data-archive]');if(edit){const item=records.find(x=>x.id===edit.dataset.edit);if(!item)return;idInput.value=item.id;nameInput.value=item.name||'';codeInput.value=item.code||'';typeInput.value=item.type||'product';unitInput.value=item.unit||'عدد';priceInput.value=item.sellPrice||0;taxInput.value=item.taxPercent||0;title.textContent='ویرایش کالا یا خدمت';saveButton.textContent='ذخیره تغییرات';byId('productDialog').showModal();nameInput.focus()}if(archive){if(!confirm('این قلم بایگانی شود؟'))return;archive.disabled=true;try{await Finora.archive('products',archive.dataset.archive);records=records.filter(x=>x.id!==archive.dataset.archive);render();notify('قلم بایگانی شد.')}catch(error){notify(`بایگانی انجام نشد: ${error.message||'خطا'}`,true)}finally{archive.disabled=false}}});
search.addEventListener('input',render);cancelButton.addEventListener('click',() => dialog.close());byId('newProduct').addEventListener('click',resetForm);Finora.requireAuth(async()=>{records=await Finora.list('products');render()});})();
</script></body></html>
