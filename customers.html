<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اشخاص | فینورا</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body><aside class="sidebar"><div class="brand">فینورا<small>مدیریت فروش تا وصول</small></div><a class="nav-link" href="dashboard.html"><span>نمای کلی</span></a><a class="nav-link" href="new-invoice.html"><span>صدور فاکتور</span></a><a class="nav-link" href="invoices.html"><span>فاکتورها</span></a><a class="nav-link active" href="customers.html"><span>اشخاص</span></a><a class="nav-link" href="products.html"><span>کالا و خدمت</span></a><a class="nav-link" href="settings.html"><span>تنظیمات فروشنده</span></a></aside><main class="content"><header class="page-head"><div><div class="eyebrow">فروش • طرف حساب</div><h1>مشتریان و اشخاص</h1><div class="muted">ثبت، ویرایش و جست‌وجوی طرف حساب‌ها</div></div><button type="button" class="btn btn-primary" id="newCustomer">مشتری جدید</button></header><div id="pageMessage" class="notice" hidden></div><div>
  <section class="card mb-4 flex-between" style="display: flex; justify-content: space-between; align-items: center; padding: 12px 22px;">
    <div class="field" style="width: 100%; max-width: 400px; margin: 0;">
      <input class="input" id="customerSearch" placeholder="جست‌وجو بر اساس نام، تلفن یا شناسه ملی...">
    </div>
  </section>
  <section class="card">
    <div class="table-wrap">
      <table class="table">
        <thead>
          <tr>
            <th>نام / عنوان</th>
            <th>نوع شخص</th>
            <th>شناسه ملی / کد ملی</th>
            <th>شماره تماس</th>
            <th style="width: 150px;">عملیات</th>
          </tr>
        </thead>
        <tbody id="customerRows"></tbody>
      </table>
    </div>
  </section>
</div>

<dialog id="customerDialog">
  <form method="dialog" class="dialog-card" id="customerForm">
    <div class="dialog-head">
      <h2 id="formTitle">افزودن مشتری جدید</h2>
      <button class="btn btn-secondary" value="cancel" type="button" id="cancelEdit">بستن</button>
    </div>
    <input type="hidden" id="customerId">
    <div class="form-grid mb-4">
      <div class="field">
        <label for="customerName">نام / عنوان *</label>
        <input class="input" id="customerName" autocomplete="organization" required>
      </div>
      <div class="field">
        <label for="customerType">نوع</label>
        <select class="select" id="customerType">
          <option value="legal">حقوقی</option>
          <option value="person">حقیقی</option>
        </select>
      </div>
      <div class="field">
        <label for="customerNationalId">شناسه ملی / کد ملی</label>
        <input class="input" id="customerNationalId" inputmode="numeric">
      </div>
      <div class="field">
        <label for="customerPhone">تلفن تماس</label>
        <input class="input" id="customerPhone" inputmode="tel">
      </div>
      <div class="field">
        <label for="customerPostalCode">کد پستی</label>
        <input class="input" id="customerPostalCode">
      </div>
      <div class="field">
        <label for="customerEconomicCode">کد اقتصادی</label>
        <input class="input" id="customerEconomicCode">
      </div>
      <div class="field">
        <label for="customerRegistrationNumber">شماره ثبت</label>
        <input class="input" id="customerRegistrationNumber">
      </div>
      <div class="field">
        <label for="customerEmail">پست الکترونیک (ایمیل)</label>
        <input class="input" id="customerEmail" type="email" inputmode="email">
      </div>
      <div class="field" style="grid-column:1/-1">
        <label for="customerAddress">نشانی دقیق</label>
        <textarea class="textarea" id="customerAddress" rows="3"></textarea>
      </div>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="saveCustomer" type="submit" style="width: 100%;">ذخیره اطلاعات مشتری</button>
    </div>
  </form>
</dialog></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/app.js"></script><script>
(()=>{'use strict';const byId=id=>document.getElementById(id),form=byId('customerForm'),idInput=byId('customerId'),nameInput=byId('customerName'),typeInput=byId('customerType'),nationalIdInput=byId('customerNationalId'),phoneInput=byId('customerPhone'),emailInput=byId('customerEmail'),addressInput=byId('customerAddress'),postalCodeInput=byId('customerPostalCode'),economicCodeInput=byId('customerEconomicCode'),registrationNumberInput=byId('customerRegistrationNumber'),saveButton=byId('saveCustomer'),cancelButton=byId('cancelEdit'),title=byId('formTitle'),rows=byId('customerRows'),search=byId('customerSearch'),message=byId('pageMessage');let records=[];
function notify(text,error=false){message.hidden=false;message.textContent=text;message.classList.toggle('notice-error',error);if(!error)setTimeout(()=>{message.hidden=true},3500)}
const dialog = byId('customerDialog'); function resetForm(){form.reset();idInput.value='';title.textContent='افزودن مشتری جدید';saveButton.textContent='ذخیره اطلاعات مشتری'; dialog.showModal(); nameInput.focus()}
function render(){const term=search.value.trim().toLowerCase(),visible=records.filter(x=>x.active!==false&&(!term||[x.name,x.phone,x.nationalId].some(v=>String(v||'').toLowerCase().includes(term))));rows.innerHTML=visible.map(x=>`<tr><td>${Finora.escape(x.name)}</td><td>${x.type==='person'?'حقیقی':'حقوقی'}</td><td>${Finora.escape(x.nationalId||'—')}</td><td>${Finora.escape(x.phone||'—')}</td><td><div class="actions"><button type="button" class="btn btn-secondary" data-edit="${x.id}">ویرایش</button><button type="button" class="btn btn-danger" data-archive="${x.id}">بایگانی</button></div></td></tr>`).join('')||'<tr><td colspan="5" class="empty">مشتری فعالی ثبت نشده است.</td></tr>'}
form.addEventListener('submit',async event=>{event.preventDefault();const customerName=nameInput.value.trim();if(!customerName){notify('نام یا عنوان مشتری را وارد کنید.',true);nameInput.focus();return}saveButton.disabled=true;saveButton.textContent='در حال ذخیره…';try{const saved=await Finora.save('customers',{id:idInput.value||undefined,name:customerName,type:typeInput.value,nationalId:nationalIdInput.value.trim(),phone:phoneInput.value.trim(),email:emailInput.value.trim(),address:addressInput.value.trim(),postalCode:postalCodeInput.value.trim(),economicCode:economicCodeInput.value.trim(),registrationNumber:registrationNumberInput.value.trim(),active:true});const index=records.findIndex(x=>x.id===saved.id);index>=0?records.splice(index,1,saved):records.unshift(saved);render();resetForm();dialog.close(); notify('مشتری با موفقیت ذخیره شد.')}catch(error){notify(`ذخیره مشتری انجام نشد: ${error.message||'خطای نامشخص'}`,true)}finally{saveButton.disabled=false;if(!idInput.value)saveButton.textContent='ذخیره مشتری'}});
rows.addEventListener('click',async event=>{const edit=event.target.closest('[data-edit]'),archive=event.target.closest('[data-archive]');if(edit){const item=records.find(x=>x.id===edit.dataset.edit);if(!item)return;idInput.value=item.id;nameInput.value=item.name||'';typeInput.value=item.type||'legal';nationalIdInput.value=item.nationalId||'';phoneInput.value=item.phone||'';emailInput.value=item.email||'';addressInput.value=item.address||'';postalCodeInput.value=item.postalCode||'';economicCodeInput.value=item.economicCode||'';registrationNumberInput.value=item.registrationNumber||'';title.textContent='ویرایش مشتری';saveButton.textContent='ذخیره تغییرات';byId('customerDialog').showModal();nameInput.focus()}if(archive){if(!confirm('این مشتری بایگانی شود؟'))return;archive.disabled=true;try{await Finora.archive('customers',archive.dataset.archive);records=records.filter(x=>x.id!==archive.dataset.archive);render();notify('مشتری بایگانی شد.')}catch(error){notify(`بایگانی انجام نشد: ${error.message||'خطا'}`,true)}finally{archive.disabled=false}}});
search.addEventListener('input',render);cancelButton.addEventListener('click',() => dialog.close());byId('newCustomer').addEventListener('click',resetForm);Finora.requireAuth(async()=>{records=await Finora.list('customers');render()});})();
</script></body></html>
