<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اشخاص | فینورا</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body><aside class="sidebar"><div class="brand">فینورا<small>مدیریت فروش تا وصول</small></div><a class="nav-link" href="dashboard.html"><span>نمای کلی</span></a><a class="nav-link" href="new-invoice.html"><span>صدور فاکتور</span></a><a class="nav-link" href="invoices.html"><span>فاکتورها</span></a><a class="nav-link active" href="customers.html"><span>اشخاص</span></a><a class="nav-link " href="products.html"><span>کالا و خدمت</span></a><a class="nav-link" href="settings.html"><span>تنظیمات فروشنده</span></a></aside><main class="content"><header class="page-head"><div><div class="eyebrow">اطلاعات پایه</div><h1>مشتریان و طرف‌حساب‌ها</h1><div class="muted">اطلاعات هویتی و تماس مورد استفاده در فاکتور</div></div><button class="btn btn-primary" id="newBtn">+ مشتری جدید</button></header><section class="grid grid-2"><div class="card"><div class="field" style="margin-bottom:12px"><label>جست‌وجو</label><input class="input" id="search" placeholder="نام، شناسه ملی یا تلفن"></div><div class="table-wrap"><table class="table"><thead><tr><th>نام</th><th>شناسه ملی</th><th>تلفن</th><th>نوع</th><th></th></tr></thead><tbody id="rows"></tbody></table></div></div><form class="card" id="form"><h2 id="formTitle">مشتری جدید</h2><input id="recordId" type="hidden"><div class="field"><label>نام/عنوان *</label><input class="input" id="name" required maxlength="160"></div><div class="field"><label>نوع طرف‌حساب</label><select class="select" id="type"><option value="legal">حقوقی</option><option value="person">حقیقی</option></select></div><div class="field"><label>شناسه/کد ملی</label><input class="input" id="nationalId" maxlength="20"></div><div class="field"><label>تلفن</label><input class="input" id="phone" maxlength="30"></div><div class="field"><label>ایمیل</label><input class="input" id="email" type="email"></div><div class="field"><label>نشانی</label><textarea class="textarea" id="address" rows="3"></textarea></div><div class="actions" style="margin-top:16px"><button class="btn btn-primary" type="submit">ذخیره</button><button class="btn btn-secondary" type="button" id="cancel">انصراف</button></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/app.js"></script><script>let records=[];function reset(){form.reset();recordId.value='';formTitle.textContent='مشتری جدید'}function render(){const q=search.value.trim();const data=records.filter(x=>x.active!==false&&(!q||[x.name,x.nationalId,x.phone].some(v=>(v||'').includes(q))));rows.innerHTML=data.map(x=>`<tr><td><strong>${Finora.escape(x.name)}</strong></td><td>${Finora.escape(x.nationalId)}</td><td>${Finora.escape(x.phone)}</td><td>${x.type==='person'?'حقیقی':'حقوقی'}</td><td><button class="btn btn-secondary" onclick="editRecord('${x.id}')">ویرایش</button> <button class="btn btn-danger" onclick="archiveRecord('${x.id}')">بایگانی</button></td></tr>`).join('')||'<tr><td colspan="5" class="empty">مشتری ثبت نشده است.</td></tr>'}window.editRecord=id=>{const x=records.find(r=>r.id===id);recordId.value=x.id;name.value=x.name||'';type.value=x.type||'legal';nationalId.value=x.nationalId||'';phone.value=x.phone||'';email.value=x.email||'';address.value=x.address||'';formTitle.textContent='ویرایش مشتری'};window.archiveRecord=async id=>{if(!confirm('این مشتری بایگانی شود؟ فاکتورهای قبلی حفظ می‌شوند.'))return;await Finora.archive('customers',id);records=await Finora.list('customers',null);render()};form.onsubmit=async e=>{e.preventDefault();if(name.value.trim().length<2)return alert('نام معتبر وارد کنید.');await Finora.save('customers',{id:recordId.value||undefined,name:name.value.trim(),type:type.value,nationalId:nationalId.value.trim(),phone:phone.value.trim(),email:email.value.trim(),address:address.value.trim(),active:true});records=await Finora.list('customers',null);reset();render()};newBtn.onclick=reset;cancel.onclick=reset;search.oninput=render;Finora.requireAuth(async()=>{records=await Finora.list('customers',null);render()});</script></body></html>
