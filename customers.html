<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>اشخاص | فینورا</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body><aside class="sidebar"><div class="brand">فینورا<small>مدیریت فروش تا وصول</small></div><a class="nav-link" href="dashboard.html"><span>نمای کلی</span></a><a class="nav-link" href="new-invoice.html"><span>صدور فاکتور</span></a><a class="nav-link" href="invoices.html"><span>فاکتورها</span></a><a class="nav-link active" href="customers.html"><span>اشخاص</span></a><a class="nav-link" href="products.html"><span>کالا و خدمت</span></a><a class="nav-link" href="settings.html"><span>تنظیمات فروشنده</span></a></aside><main class="content"><header class="page-head"><div><div class="eyebrow">فروش • طرف حساب</div><h1>مشتریان و اشخاص</h1><div class="muted">ثبت، ویرایش و جست‌وجوی طرف حساب‌ها</div></div><button type="button" class="btn btn-primary" id="newCustomer">مشتری جدید</button></header><div id="pageMessage" class="notice" hidden></div><div class="grid grid-2"><section class="card"><h2 id="formTitle">افزودن مشتری</h2><form id="customerForm"><input type="hidden" id="customerId"><div class="form-grid"><div class="field"><label for="customerName">نام / عنوان *</label><input class="input" id="customerName" autocomplete="organization" required></div><div class="field"><label for="customerType">نوع</label><select class="select" id="customerType"><option value="legal">حقوقی</option><option value="person">حقیقی</option></select></div><div class="field"><label for="customerNationalId">شناسه ملی / کد ملی</label><input class="input" id="customerNationalId" inputmode="numeric"></div><div class="field"><label for="customerPhone">تلفن</label><input class="input" id="customerPhone" inputmode="tel"></div><div class="field"><label for="customerEmail">ایمیل</label><input class="input" id="customerEmail" type="email" inputmode="email"></div><div class="field" style="grid-column:1/-1"><label for="customerAddress">نشانی</label><textarea class="textarea" id="customerAddress" rows="3"></textarea></div></div><div class="actions"><button class="btn btn-primary" id="saveCustomer" type="submit">ذخیره مشتری</button><button class="btn btn-secondary" id="cancelEdit" type="button" hidden>انصراف</button></div></form></section><section class="card"><h2>فهرست اشخاص</h2><div class="field"><label for="customerSearch">جست‌وجو</label><input class="input" id="customerSearch" placeholder="نام، تلفن یا شناسه ملی"></div><div class="table-wrap"><table class="table"><thead><tr><th>نام</th><th>نوع</th><th>شناسه</th><th>تلفن</th><th></th></tr></thead><tbody id="customerRows"></tbody></table></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/app.js"></script><script>
(()=>{'use strict';const byId=id=>document.getElementById(id),form=byId('customerForm'),idInput=byId('customerId'),nameInput=byId('customerName'),typeInput=byId('customerType'),nationalIdInput=byId('customerNationalId'),phoneInput=byId('customerPhone'),emailInput=byId('customerEmail'),addressInput=byId('customerAddress'),saveButton=byId('saveCustomer'),cancelButton=byId('cancelEdit'),title=byId('formTitle'),rows=byId('customerRows'),search=byId('customerSearch'),message=byId('pageMessage');let records=[];
function notify(text,error=false){message.hidden=false;message.textContent=text;message.classList.toggle('notice-error',error);if(!error)setTimeout(()=>{message.hidden=true},3500)}
function resetForm(){form.reset();idInput.value='';title.textContent='افزودن مشتری';saveButton.textContent='ذخیره مشتری';cancelButton.hidden=true;nameInput.focus()}
function render() {
  const term = search.value.trim().toLowerCase();

  const visible = records.filter(x =>
    x.active !== false && (
      !term || [x.name, x.phone, x.nationalId].some(v => String(v || '').toLowerCase().includes(term))
    )
  );

  const rowsHtml = visible.map(x => `
    <tr>
      <td>${Finora.escape(x.name)}</td>
      <td>${x.type === 'person' ? 'حقیقی' : 'حقوقی'}</td>
      <td>${Finora.escape(x.nationalId || '—')}</td>
      <td>${Finora.escape(x.phone || '—')}</td>
      <td>
        <div class="actions">
          <button type="button" class="btn btn-secondary" data-edit="${x.id}">ویرایش</button>
          <button type="button" class="btn btn-danger" data-archive="${x.id}">بایگانی</button>
        </div>
      </td>
    </tr>
  `).join('');

  rows.innerHTML = rowsHtml || '<tr><td colspan="5" class="empty">مشتری فعالی ثبت نشده است.</td></tr>';
}
form.addEventListener('submit',async event=>{event.preventDefault();const customerName=nameInput.value.trim();if(!customerName){notify('نام یا عنوان مشتری را وارد کنید.',true);nameInput.focus();return}saveButton.disabled=true;saveButton.textContent='در حال ذخیره…';try{const saved=await Finora.save('customers',{id:idInput.value||undefined,name:customerName,type:typeInput.value,nationalId:nationalIdInput.value.trim(),phone:phoneInput.value.trim(),email:emailInput.value.trim(),address:addressInput.value.trim(),active:true});const index=records.findIndex(x=>x.id===saved.id);index>=0?records.splice(index,1,saved):records.unshift(saved);render();resetForm();notify('مشتری با موفقیت ذخیره شد.')}catch(error){notify(`ذخیره مشتری انجام نشد: ${error.message||'خطای نامشخص'}`,true)}finally{saveButton.disabled=false;if(!idInput.value)saveButton.textContent='ذخیره مشتری'}});
rows.addEventListener('click',async event=>{const edit=event.target.closest('[data-edit]'),archive=event.target.closest('[data-archive]');if(edit){const item=records.find(x=>x.id===edit.dataset.edit);if(!item)return;idInput.value=item.id;nameInput.value=item.name||'';typeInput.value=item.type||'legal';nationalIdInput.value=item.nationalId||'';phoneInput.value=item.phone||'';emailInput.value=item.email||'';addressInput.value=item.address||'';title.textContent='ویرایش مشتری';saveButton.textContent='ذخیره تغییرات';cancelButton.hidden=false;form.scrollIntoView({behavior:'smooth'});nameInput.focus()}if(archive){if(!confirm('این مشتری بایگانی شود؟'))return;archive.disabled=true;try{await Finora.archive('customers',archive.dataset.archive);records=records.filter(x=>x.id!==archive.dataset.archive);render();notify('مشتری بایگانی شد.')}catch(error){notify(`بایگانی انجام نشد: ${error.message||'خطا'}`,true)}finally{archive.disabled=false}}});
search.addEventListener('input',render);cancelButton.addEventListener('click',resetForm);byId('newCustomer').addEventListener('click',resetForm);Finora.requireAuth(async()=>{records=await Finora.list('customers');render()});})();
</script></body></html>
