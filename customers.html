<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>اشخاص | فینورا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body>
<aside class="sidebar"><div class="brand">فینورا<small>مدیریت فروش تا وصول</small></div><a class="nav-link" href="dashboard.html"><span>نمای کلی</span></a><a class="nav-link" href="new-invoice.html"><span>صدور فاکتور</span></a><a class="nav-link" href="invoices.html"><span>فاکتورها</span></a><a class="nav-link active" href="customers.html"><span>اشخاص</span></a><a class="nav-link" href="products.html"><span>کالا و خدمت</span></a><a class="nav-link" href="settings.html"><span>تنظیمات فروشنده</span></a></aside>
<main class="content">
<header class="page-head"><div><div class="eyebrow">فروش • طرف حساب</div><h1>مشتریان و اشخاص</h1><div class="muted">اطلاعات هویتی و تماس طرف حساب‌ها</div></div><button type="button" class="btn btn-primary" id="newCustomer">+ مشتری جدید</button></header>
<div id="pageMessage" class="notice" role="status" hidden></div>
<section class="card list-toolbar"><div class="field"><label for="customerSearch">جست‌وجوی اشخاص</label><input class="input" id="customerSearch" placeholder="نام، تلفن، شناسه ملی یا کد اقتصادی"></div></section>
<section class="card"><div class="table-wrap"><table class="table"><thead><tr><th>نام / عنوان</th><th>نوع</th><th>شناسه ملی / کد ملی</th><th>کد اقتصادی</th><th>شماره تماس</th><th>عملیات</th></tr></thead><tbody id="customerRows"></tbody></table></div></section>
</main>
<dialog id="customerDialog" aria-labelledby="formTitle">
<form class="dialog-card" id="customerForm">
<div class="dialog-head"><div><h2 id="formTitle">افزودن مشتری</h2><p class="muted">اطلاعات قانونی لازم برای چاپ فاکتور را کامل کنید.</p></div><button class="btn btn-secondary" type="button" id="closeCustomer">بستن</button></div>
<input type="hidden" id="customerId">
<div class="form-grid">
<div class="field"><label for="customerName">نام / عنوان *</label><input class="input" id="customerName" autocomplete="organization" maxlength="160" required></div>
<div class="field"><label for="customerType">نوع شخص</label><select class="select" id="customerType"><option value="legal">حقوقی</option><option value="person">حقیقی</option></select></div>
<div class="field"><label for="customerNationalId">شناسه ملی / کد ملی</label><input class="input" id="customerNationalId" inputmode="numeric" maxlength="30"></div>
<div class="field"><label for="customerEconomicCode">شماره اقتصادی</label><input class="input" id="customerEconomicCode" inputmode="numeric" maxlength="30"></div>
<div class="field"><label for="customerRegistrationNumber">شماره ثبت</label><input class="input" id="customerRegistrationNumber" maxlength="30"></div>
<div class="field"><label for="customerPhone">شماره تماس</label><input class="input" id="customerPhone" inputmode="tel" maxlength="30"></div>
<div class="field"><label for="customerPostalCode">کد پستی</label><input class="input" id="customerPostalCode" inputmode="numeric" maxlength="20"></div>
<div class="field"><label for="customerEmail">ایمیل داخلی پرونده</label><input class="input" id="customerEmail" type="email" inputmode="email" maxlength="160"><small class="muted">در فاکتور چاپ نمی‌شود.</small></div>
<div class="field field-wide"><label for="customerAddress">نشانی کامل</label><textarea class="textarea" id="customerAddress" rows="3" maxlength="600"></textarea></div>
</div>
<div class="dialog-actions"><button class="btn btn-secondary" type="button" id="cancelCustomer">انصراف</button><button class="btn btn-primary" id="saveCustomer" type="submit">ذخیره مشتری</button></div>
</form>
</dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/app.js"></script>
<script>
(()=>{'use strict';
const byId=id=>document.getElementById(id),dialog=byId('customerDialog'),form=byId('customerForm'),idInput=byId('customerId'),nameInput=byId('customerName'),typeInput=byId('customerType'),nationalIdInput=byId('customerNationalId'),economicCodeInput=byId('customerEconomicCode'),registrationNumberInput=byId('customerRegistrationNumber'),phoneInput=byId('customerPhone'),postalCodeInput=byId('customerPostalCode'),emailInput=byId('customerEmail'),addressInput=byId('customerAddress'),saveButton=byId('saveCustomer'),title=byId('formTitle'),rows=byId('customerRows'),search=byId('customerSearch'),message=byId('pageMessage');let records=[];
function notify(text,error=false){message.hidden=false;message.textContent=text;message.classList.toggle('notice-error',error);if(!error)setTimeout(()=>{message.hidden=true},3500)}
function closeDialog(){dialog.close();form.reset();idInput.value=''}
function openCreate(){form.reset();idInput.value='';typeInput.value='legal';title.textContent='افزودن مشتری';saveButton.textContent='ذخیره مشتری';dialog.showModal();nameInput.focus()}
function openEdit(item){idInput.value=item.id;nameInput.value=item.name||'';typeInput.value=item.type||'legal';nationalIdInput.value=item.nationalId||'';economicCodeInput.value=item.economicCode||'';registrationNumberInput.value=item.registrationNumber||'';phoneInput.value=item.phone||'';postalCodeInput.value=item.postalCode||'';emailInput.value=item.email||'';addressInput.value=item.address||'';title.textContent='ویرایش مشتری';saveButton.textContent='ذخیره تغییرات';dialog.showModal();nameInput.focus()}
function render(){const term=search.value.trim().toLowerCase(),visible=records.filter(item=>item.active!==false&&(!term||[item.name,item.phone,item.nationalId,item.economicCode].some(value=>String(value||'').toLowerCase().includes(term))));rows.innerHTML=visible.map(item=>`<tr><td>${Finora.escape(item.name)}</td><td>${item.type==='person'?'حقیقی':'حقوقی'}</td><td>${Finora.escape(item.nationalId||'—')}</td><td>${Finora.escape(item.economicCode||'—')}</td><td>${Finora.escape(item.phone||'—')}</td><td><div class="actions"><button type="button" class="btn btn-secondary" data-edit="${Finora.escape(item.id)}">ویرایش</button><button type="button" class="btn btn-danger" data-archive="${Finora.escape(item.id)}">بایگانی</button></div></td></tr>`).join('')||'<tr><td colspan="6" class="empty">مشتری فعالی ثبت نشده است.</td></tr>'}
form.addEventListener('submit',async event=>{event.preventDefault();const customerName=nameInput.value.trim();if(customerName.length<2){notify('نام یا عنوان مشتری باید حداقل دو نویسه باشد.',true);nameInput.focus();return}saveButton.disabled=true;const oldText=saveButton.textContent;saveButton.textContent='در حال ذخیره…';try{const saved=await Finora.save('customers',{id:idInput.value||undefined,name:customerName,type:typeInput.value,nationalId:nationalIdInput.value.trim(),economicCode:economicCodeInput.value.trim(),registrationNumber:registrationNumberInput.value.trim(),phone:phoneInput.value.trim(),postalCode:postalCodeInput.value.trim(),email:emailInput.value.trim(),address:addressInput.value.trim(),active:true});const index=records.findIndex(item=>item.id===saved.id);index>=0?records.splice(index,1,saved):records.unshift(saved);render();closeDialog();notify('مشتری با موفقیت ذخیره شد.')}catch(error){notify(`ذخیره مشتری انجام نشد: ${error.message||'خطای نامشخص'}`,true)}finally{saveButton.disabled=false;saveButton.textContent=oldText}});
rows.addEventListener('click',async event=>{const edit=event.target.closest('[data-edit]'),archive=event.target.closest('[data-archive]');if(edit){const item=records.find(record=>record.id===edit.dataset.edit);if(item)openEdit(item);return}if(archive){if(!confirm('این مشتری بایگانی شود؟'))return;archive.disabled=true;try{await Finora.archive('customers',archive.dataset.archive);records=records.filter(item=>item.id!==archive.dataset.archive);render();notify('مشتری بایگانی شد.')}catch(error){notify(`بایگانی انجام نشد: ${error.message||'خطا'}`,true)}finally{archive.disabled=false}}});
search.addEventListener('input',render);byId('newCustomer').addEventListener('click',openCreate);byId('closeCustomer').addEventListener('click',closeDialog);byId('cancelCustomer').addEventListener('click',closeDialog);dialog.addEventListener('cancel',event=>{event.preventDefault();closeDialog()});Finora.requireAuth(async()=>{records=await Finora.list('customers');render()});
})();
</script>
</body></html>
