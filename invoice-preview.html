<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاکتور | فینورا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body class="invoice-preview-page">
<main class="invoice-preview-content">
<div class="actions screen-only invoice-preview-actions"><button class="btn btn-primary" id="outputButton" type="button">چاپ / ذخیره PDF</button><a class="btn btn-secondary" id="editLink">ویرایش</a><input class="input" id="paymentInput" type="number" min="0" placeholder="دریافت جدید"><button class="btn btn-secondary" id="paymentBtn" type="button">ثبت دریافت</button><button class="btn btn-danger" id="voidBtn" type="button">ابطال فاکتور</button><a class="btn btn-secondary" id="back" href="invoices.html">بازگشت</a></div>
<article class="invoice-paper" id="paper"><div class="empty">در حال بارگذاری فاکتور…</div></article>
</main>
<dialog id="outputDialog" class="screen-only"><div class="dialog-card"><div class="dialog-head"><div><h2>نوع خروجی را انتخاب کنید</h2><p class="muted" id="paperHint">مرورگر پنجره استاندارد چاپ را باز می‌کند.</p></div><button class="btn btn-secondary" id="closeOutput" type="button">بستن</button></div><div class="choice-grid"><button class="choice-card" id="pdfOutput" type="button"><strong>ذخیره PDF</strong><br><small class="muted">در پنجره بعدی مقصد «Save as PDF» را انتخاب کنید.</small></button><button class="choice-card" id="printerOutput" type="button"><strong>چاپ با چاپگر</strong><br><small class="muted">اندازه کاغذ پیشنهادشده را انتخاب کنید.</small></button></div></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/invoice-core.js"></script><script src="assets/js/app.js"></script>
<script>
Finora.requireAuth(async()=>{'use strict';
const byId=id=>document.getElementById(id),back=byId('back'),editLink=byId('editLink'),paymentButton=byId('paymentBtn'),voidButton=byId('voidBtn'),paymentInput=byId('paymentInput'),paper=byId('paper'),outputButton=byId('outputButton'),outputDialog=byId('outputDialog');let invoice=null;
outputButton.onclick=()=>outputDialog.showModal();byId('closeOutput').onclick=()=>outputDialog.close();const openPrintDialog=mode=>{outputDialog.close();const originalTitle=document.title;if(mode==='pdf')document.title=`Finora-${String(invoice?.invoiceNumber||'Invoice').replace(/[^\p{L}\p{N}._-]+/gu,'-')}`;window.addEventListener('afterprint',()=>{document.title=originalTitle},{once:true});window.print()};byId('pdfOutput').onclick=()=>openPrintDialog('pdf');byId('printerOutput').onclick=()=>openPrintDialog('printer');if(Finora.demo)back.href='invoices.html?demo=1';
const id=new URLSearchParams(location.search).get('id');invoice=await Finora.get('invoices',id);if(!invoice){paper.innerHTML='<div class="empty">فاکتور یافت نشد.</div>';paymentButton.disabled=true;voidButton.disabled=true;outputButton.disabled=true;return}
const [currentSeller,currentCustomer]=await Promise.all([Finora.get('settings','seller'),invoice.customerId?Finora.get('customers',invoice.customerId):null]),taxContext=FinoraInvoice.taxContext(invoice),official=taxContext.invoiceType==='official',limit=official?15:10,lineCount=(invoice.items||[]).length,currencyUnit=invoice.currencyUnit||currentSeller?.currencyUnit||'rial',seller=Object.keys(invoice.sellerSnapshot||{}).length?invoice.sellerSnapshot:Finora.sellerSnapshot(currentSeller||{}),customer=Object.keys(invoice.customerSnapshot||{}).length?invoice.customerSnapshot:Finora.customerSnapshot(currentCustomer||{name:invoice.customerName,nationalId:invoice.customerNationalId}),payment=FinoraInvoice.paymentStatus(invoice.total,invoice.paidAmount),documentState=FinoraInvoice.documentStatus(invoice);
document.body.classList.add(official?'print-a4':'print-a5');paper.classList.add(official?'invoice-official':'invoice-unofficial',lineCount>12?'print-density-tight':lineCount>8?'print-density-compact':'print-density-standard');paper.dataset.printLineCount=String(lineCount);paper.dataset.paperSize=official?'A4':'A5';byId('paperHint').textContent=`خروجی ${official?'A4':'A5'} افقی و تک‌صفحه تنظیم شده است.`;paymentInput.placeholder=`دریافت جدید (${Finora.currencyLabel(currencyUnit)})`;editLink.href=`new-invoice.html?id=${encodeURIComponent(id)}${Finora.demo?'&demo=1':''}`;const defaultOutput=currentSeller?.defaultOutputMode==='pdf'?'pdfOutput':'printerOutput';byId(defaultOutput).insertAdjacentHTML('afterbegin','<span class="badge badge-paid">پیش‌فرض</span><br>');
if(lineCount>limit){outputButton.disabled=true;paper.insertAdjacentHTML('beforebegin',`<div class="notice notice-error screen-only print-limit-notice">برای چاپ تک‌صفحه ${official?'A4':'A5'} افقی، حداکثر ${limit} ردیف مجاز است. این فاکتور ${lineCount} ردیف دارد؛ ابتدا آن را ویرایش کنید.</div>`)}
paymentButton.onclick=async()=>{const amount=Finora.toBaseAmount(paymentInput.value,currencyUnit);if(amount<=0){alert('مبلغ دریافت را وارد کنید.');paymentInput.focus();return}paymentButton.disabled=true;try{await Finora.saveInvoice({...invoice,paidAmount:(Number(invoice.paidAmount)||0)+amount});location.reload()}catch(error){alert(`ثبت دریافت انجام نشد: ${error.message||'خطا'}`);paymentButton.disabled=false}};
voidButton.onclick=async()=>{if(!confirm('فاکتور ابطال شود؟'))return;voidButton.disabled=true;try{await Finora.saveInvoice({...invoice,documentStatus:'void',voidedAt:new Date().toISOString()});location.reload()}catch(error){alert(`ابطال فاکتور انجام نشد: ${error.message||'خطا'}`);voidButton.disabled=false}};
const val=value=>Finora.escape(value||'—'),money=value=>Finora.money(value,currencyUnit),unit=Finora.currencyLabel(currencyUnit),field=(label,value,wide=false)=>`<div class="legal-field${wide?' wide':''}"><span>${label}</span><strong>${val(value)}</strong></div>`,partyFields=(party,nameKey='name')=>`${field('نام / عنوان',party?.[nameKey])}${field('شناسه ملی / کد ملی',party?.nationalId)}${field('شماره اقتصادی',party?.economicCode)}${field('شماره ثبت',party?.registrationNumber)}${field('تلفن',party?.phone)}${field('کد پستی',party?.postalCode)}${field('نشانی',[party?.province,party?.city,party?.address].filter(Boolean).join('، '),true)}`;
function officialRows(){const source=(invoice.items||[]).slice(0,15),rows=Array.from({length:15},(_,index)=>source[index]||null);return rows.map((item,index)=>item?`<tr><td>${index+1}</td><td>${val(item.description)}</td><td>${val(item.unit||'عدد')}</td><td>${item.quantity}</td><td>${money(item.unitPrice)}</td><td>${money(item.discount)}</td><td>${money(item.tax)}</td><td>${money(item.total)}</td></tr>`:`<tr class="blank-line"><td>${index+1}</td><td>&nbsp;</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`).join('')}
function unofficialRows(){const source=(invoice.items||[]).slice(0,10),minimum=Math.max(5,source.length);return Array.from({length:minimum},(_,index)=>source[index]||null).map((item,index)=>item?`<tr><td>${index+1}</td><td>${val(item.description)}</td><td>${val(item.unit||'عدد')}</td><td>${item.quantity}</td><td>${money(item.unitPrice)}</td><td>${money(item.taxable)}</td></tr>`:`<tr class="blank-line"><td>${index+1}</td><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>`).join('')}
function header(title,subtitle){return `<header class="invoice-document-head"><div class="invoice-brand"><div class="eyebrow">FINORA ERP</div><h1>${title}</h1><p>${subtitle}</p></div><div class="invoice-number-box"><span>شماره فاکتور</span><strong>${val(invoice.invoiceNumber||'پیش‌نویس')}</strong><span class="badge badge-${documentState.code}">${documentState.label}</span></div></header><section class="invoice-document-meta"><div><span>تاریخ صدور</span><strong>${val(invoice.issueDate)}</strong></div><div><span>تاریخ سررسید</span><strong>${val(invoice.dueDate)}</strong></div><div><span>روش پرداخت</span><strong>${val(invoice.paymentMethod)}</strong></div><div><span>واحد پول</span><strong>${unit}</strong></div></section>`}
function partyPanels(){return `<section class="official-parties"><div class="legal-party"><h2>مشخصات فروشنده</h2><div class="legal-field-grid">${partyFields(seller,'businessName')}</div></div><div class="legal-party"><h2>مشخصات خریدار</h2><div class="legal-field-grid">${partyFields(customer)}</div></div></section>`}
function notesAndTotals(includeTax){const totalWords=FinoraInvoice.amountToWords(Finora.fromBaseAmount(invoice.total,currencyUnit));return `<section class="invoice-closing"><div class="invoice-notes"><h3>توضیحات و شرایط پرداخت</h3><p>${val(invoice.notes||seller?.invoiceFooter||'—')}</p>${seller?.bankAccount?`<p class="bank-note"><strong>اطلاعات پرداخت:</strong> ${val(seller.bankAccount)}</p>`:''}<p class="amount-words"><strong>مبلغ به حروف:</strong> ${val(totalWords)} ${unit}</p><div class="signature-row"><span>مهر و امضای فروشنده</span><span>مهر و امضای خریدار</span></div></div><div class="invoice-totals"><div><span>جمع ناخالص</span><strong>${money(invoice.subtotal)}</strong></div><div><span>تخفیف</span><strong>${money((invoice.lineDiscount||0)+(invoice.invoiceDiscountAmount||0))}</strong></div>${includeTax?`<div><span>مالیات و عوارض</span><strong>${money(invoice.tax)}</strong></div>`:''}<div class="grand-total"><span>مبلغ قابل پرداخت</span><strong>${money(invoice.total)}</strong></div><div><span>دریافتی</span><strong>${money(invoice.paidAmount)}</strong></div><div><span>مانده</span><strong>${money(payment.balance)}</strong></div></div></section>`}
function renderOfficial(){return `${header('صورتحساب رسمی فروش کالا و خدمات','قالب رسمی با مشخصات قانونی طرفین')}${partyPanels()}<section class="invoice-lines"><table class="table official-lines"><thead><tr><th>ردیف</th><th>شرح کالا / خدمت</th><th>واحد</th><th>تعداد</th><th>مبلغ واحد</th><th>تخفیف</th><th>مالیات و عوارض</th><th>مبلغ کل</th></tr></thead><tbody>${officialRows()}</tbody></table></section>${notesAndTotals(true)}<footer class="invoice-document-footer"><span>انتخاب عنوان رسمی به‌تنهایی به معنی ارسال یا تأیید در سامانه مؤدیان نیست.</span>${invoice.taxRuleVersion?`<span>پروفایل مالیاتی: ${val(invoice.taxRuleVersion)} • سال ${val(invoice.taxYear)}</span>`:''}</footer>`}
function renderUnofficial(){return `${header('فاکتور فروش کالا و خدمات','فاکتور غیررسمی تجاری')}${partyPanels()}<section class="invoice-lines"><table class="table unofficial-lines"><thead><tr><th>ردیف</th><th>شرح کالا / خدمت</th><th>واحد</th><th>تعداد</th><th>مبلغ واحد</th><th>مبلغ پس از تخفیف</th></tr></thead><tbody>${unofficialRows()}</tbody></table></section>${notesAndTotals(false)}<footer class="invoice-document-footer"><span>این فاکتور غیررسمی است و جایگزین صورتحساب الکترونیکی رسمی نیست.</span><span>خروجی A5 افقی</span></footer>`}
paper.innerHTML=official?renderOfficial():renderUnofficial();
});
</script>
</body></html>
