<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاکتور | فینورا</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body><main class="content" style="margin:0"><div class="actions screen-only" style="max-width:900px;margin:0 auto 16px"><button class="btn btn-primary" onclick="print()">چاپ / ذخیره PDF</button><a class="btn btn-secondary" id="editLink">ویرایش</a><input class="input" id="paymentInput" type="number" min="0" placeholder="دریافت جدید (ریال)" style="max-width:190px"><button class="btn btn-secondary" id="paymentBtn">ثبت دریافت</button><button class="btn btn-danger" id="voidBtn">ابطال فاکتور</button><a class="btn btn-secondary" id="back" href="invoices.html">بازگشت</a></div><article class="invoice-paper" id="paper"><div class="empty">در حال بارگذاری فاکتور…</div></article></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/invoice-core.js"></script><script src="assets/js/app.js"></script><script>Finora.requireAuth(async()=>{if(Finora.demo)back.href='invoices.html?demo=1';const id=new URLSearchParams(location.search).get('id'),x=await Finora.get('invoices',id),seller=await Finora.get('settings','seller');editLink.href=`new-invoice.html?id=${id}${Finora.demo?'&demo=1':''}`;paymentBtn.onclick=async()=>{const amount=Number(paymentInput.value)||0;if(amount<=0)return;await Finora.saveInvoice({...x,paidAmount:(Number(x.paidAmount)||0)+amount});location.reload()};voidBtn.onclick=async()=>{if(!confirm('فاکتور ابطال شود؟'))return;await Finora.saveInvoice({...x,documentStatus:'void',voidedAt:new Date().toISOString()});location.reload()};if(!x){paper.innerHTML='<div class="empty">فاکتور یافت نشد.</div>';return}const payment=FinoraInvoice.paymentStatus(x.total,x.paidAmount),pay=FinoraInvoice.documentStatus(x);paper.innerHTML=`<header><div><div class="eyebrow">FINORA</div><h1>فاکتور فروش</h1><div class="muted">سند فروش و مطالبه</div></div><div><strong>${Finora.escape(x.invoiceNumber||'پیش‌نویس')}</strong><br><span class="badge badge-${pay.code}">${pay.label}</span></div></header><section class="invoice-meta"><div><small class="muted">فروشنده</small><br><strong>${Finora.escape(seller?.businessName||'فروشنده')}</strong><br><small>${Finora.escape(seller?.nationalId||'')}</small><br><small>${Finora.escape(seller?.phone||'')}</small></div><div><small class="muted">خریدار</small><br><strong>${Finora.escape(x.customerName)}</strong><br><small>${Finora.escape(x.customerNationalId||'')}</small></div><div><small class="muted">تاریخ صدور / سررسید</small><br>${Finora.escape(x.issueDate)}<br>${Finora.escape(x.dueDate||'—')}</div></section><table class="table"><thead><tr><th>ردیف</th><th>شرح</th><th>تعداد</th><th>فی</th><th>تخفیف</th><th>مالیات</th><th>جمع</th></tr></thead><tbody>${(x.items||[]).map((i,n)=>`<tr><td>${n+1}</td><td>${Finora.escape(i.description)}</td><td>${i.quantity}</td><td>${Finora.money(i.unitPrice)}</td><td>${Finora.money(i.discount)}</td><td>${Finora.money(i.tax)}</td><td>${Finora.money(i.total)}</td></tr>`).join('')}</tbody></table><section style="width:min(100%,420px);margin:24px 0 0 auto"><div class="summary-row"><span>جمع ناخالص</span><strong>${Finora.money(x.subtotal)}</strong></div><div class="summary-row"><span>تخفیف</span><strong>${Finora.money((x.lineDiscount||0)+(x.invoiceDiscountAmount||0))}</strong></div><div class="summary-row"><span>مالیات</span><strong>${Finora.money(x.tax)}</strong></div><div class="summary-row total"><span>مبلغ نهایی</span><strong>${Finora.money(x.total)}</strong></div><div class="summary-row"><span>دریافتی</span><strong>${Finora.money(x.paidAmount)}</strong></div><div class="summary-row"><span>مانده</span><strong>${Finora.money(payment.balance)}</strong></div></section>${x.notes?`<section><h3>توضیحات</h3><p>${Finora.escape(x.notes)}</p></section>`:''}<footer style="margin-top:60px;border-top:1px solid #dfe7e4;padding-top:14px" class="muted">این سند توسط سامانه فینورا ایجاد شده است.</footer>`});</script></body></html>
