<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>فاکتور | فینورا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body>
<main class="content" style="margin:0">
<div class="actions screen-only" style="max-width:900px;margin:0 auto 16px">
<button class="btn btn-primary" type="button" onclick="print()">چاپ / ذخیره PDF</button>
<a class="btn btn-secondary" id="editLink">ویرایش</a>
<input class="input" id="paymentInput" type="number" min="0" placeholder="دریافت جدید (ریال)" style="max-width:190px">
<button class="btn btn-secondary" id="paymentBtn" type="button">ثبت دریافت</button>
<button class="btn btn-danger" id="voidBtn" type="button">ابطال فاکتور</button>
<a class="btn btn-secondary" id="back" href="invoices.html">بازگشت</a>
</div>
<article class="invoice-paper" id="paper">
<div class="empty">در حال بارگذاری فاکتور…</div>
</article>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>
<script src="assets/js/supabase-config.js">
</script>
<script src="assets/js/invoice-core.js">
</script>
<script src="assets/js/app.js">
</script>
<script>Finora.requireAuth(async()=>{const byId=id=>document.getElementById(id),back=byId('back'),editLink=byId('editLink'),paymentButton=byId('paymentBtn'),voidButton=byId('voidBtn'),paymentInput=byId('paymentInput'),paper=byId('paper');if(Finora.demo)back.href='invoices.html?demo=1';const id=new URLSearchParams(location.search).get('id'),x=await Finora.get('invoices',id);if(!x){paper.innerHTML='<div class="empty">فاکتور یافت نشد.</div>';paymentButton.disabled=true;voidButton.disabled=true;return}const seller=await Finora.get('settings','seller');
const customer=x.customerId ? await Finora.get('customers', x.customerId) : null;editLink.href=`new-invoice.html?id=${id}${Finora.demo?'&demo=1':''}`;paymentButton.onclick=async()=>{const amount=Number(paymentInput.value)||0;if(amount<=0){alert('مبلغ دریافت را وارد کنید.');paymentInput.focus();return}paymentButton.disabled=true;paymentButton.textContent='در حال ثبت…';try{await Finora.saveInvoice({...x,paidAmount:(Number(x.paidAmount)||0)+amount});location.reload()}catch(error){alert(`ثبت دریافت انجام نشد: ${error.message||'خطا'}`);paymentButton.disabled=false;paymentButton.textContent='ثبت دریافت'}};voidButton.onclick=async()=>{if(!confirm('فاکتور ابطال شود؟'))return;voidButton.disabled=true;try{await Finora.saveInvoice({...x,documentStatus:'void',voidedAt:new Date().toISOString()});location.reload()}catch(error){alert(`ابطال فاکتور انجام نشد: ${error.message||'خطا'}`);voidButton.disabled=false}};const payment=FinoraInvoice.paymentStatus(x.total,x.paidAmount),pay=FinoraInvoice.documentStatus(x);
const isOfficial = x.invoiceType === 'official';
paper.className = 'invoice-paper ' + (isOfficial ? 'official' : 'unofficial');


function renderOfficial() {
  let rowsHtml = (x.items||[]).map((i,n)=>`<tr style="height: 38px;">
  <td style="font-size: 14px;">${n+1}</td>
  <td style="font-size: 14px;">${Finora.escape(i.description)}</td>
  <td style="font-size: 14px;">${i.quantity}</td>
  <td style="font-size: 14px;">${Finora.money(i.unitPrice)}</td>
  <td style="font-size: 14px;">${Finora.money(i.discount)}</td>
  <td style="font-size: 14px;">${Finora.money(i.tax)}</td>
  <td style="font-size: 14px;">${Finora.money(i.total)}</td>
  </tr>`).join('');
  const currentLength = (x.items||[]).length;
  for (let i = currentLength; i < 10; i++) {
    rowsHtml += `<tr style="height: 38px;"><td>${i+1}</td><td></td><td></td><td></td><td></td><td></td><td></td></tr>`;
  }
  return `<header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 12px; margin-bottom: 12px;">
  <div style="font-size: 10px; color: #666; writing-mode: vertical-rl; text-orientation: mixed;">FINORA</div>
  <h1 style="margin: 0; font-size: 28px; text-align: center; flex: 1;">فاکتور فروش کالا و خدمات</h1>
  <div style="text-align: left; font-size: 14px; min-width: 200px;">
  <div>شماره فاکتور: <strong>${Finora.escape(x.invoiceNumber||'پیش‌نویس')}</strong></div>
  <div style="margin-top: 4px;">تاریخ صدور: <strong>${Finora.escape(x.issueDate)}</strong></div>
  </div>
  </header>

  <section style="display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px;">
  <div style="border: 1px solid #000; padding: 10px; font-size: 14px; line-height: 1.8;">
  <strong>فروشنده: ${Finora.escape(seller?.businessName||'')}</strong> |
  شناسه ملی: ${Finora.escape(seller?.nationalId||'')} |
  شماره ثبت: ${Finora.escape(seller?.registrationNumber||'')} |
  کد اقتصادی: ${Finora.escape(seller?.economicCode||'')} |
  کد پستی: ${Finora.escape(seller?.postalCode||'')} |
  تلفن: ${Finora.escape(seller?.phone||'')} |
  نشانی: ${Finora.escape(seller?.address||'')}
  </div>
  <div style="border: 1px solid #000; padding: 10px; font-size: 14px; line-height: 1.8;">
  <strong>خریدار: ${Finora.escape(x.customerName)}</strong> |
  شناسه ملی: ${Finora.escape(x.customerNationalId||'')} |
  شماره ثبت: ${Finora.escape(customer?.registrationNumber||'')} |
  کد اقتصادی: ${Finora.escape(customer?.economicCode||'')} |
  کد پستی: ${Finora.escape(customer?.postalCode||'')} |
  تلفن: ${Finora.escape(customer?.phone||'')} |
  نشانی: ${Finora.escape(customer?.address||'')}
  </div>
  </section>

  <table class="table" style="margin-bottom: 16px; border: 1px solid #000;">
  <thead><tr style="background: #f0f0f0;"><th style="font-size: 13px;">ردیف</th><th style="font-size: 13px;">شرح کالا یا خدمات</th><th style="font-size: 13px;">تعداد</th><th style="font-size: 13px;">مبلغ واحد (ریال)</th><th style="font-size: 13px;">تخفیف (ریال)</th><th style="font-size: 13px;">مالیات و عوارض (ریال)</th><th style="font-size: 13px;">مبلغ کل پس از تخفیف و مالیات (ریال)</th></tr></thead>
  <tbody>${rowsHtml}</tbody>
  </table>

  <section style="display:flex; justify-content:space-between; gap: 16px;">
  <div style="flex:1;">
    <div style="border:1px solid #000; padding:10px; height:100%; font-size: 14px;">
      <strong>توضیحات:</strong>
      <p style="margin: 8px 0 0 0; white-space: pre-wrap;">${x.notes?Finora.escape(x.notes):'ندارد'}</p>
    </div>
  </div>
  <div style="width: 350px; font-size: 15px;">
  <div style="display: flex; justify-content: space-between; padding: 6px 0;"><span>جمع کل تخفیف:</span><strong>${Finora.money((x.lineDiscount||0)+(x.invoiceDiscountAmount||0))}</strong></div>
  <div style="display: flex; justify-content: space-between; padding: 6px 0;"><span>جمع کل مالیات و عوارض:</span><strong>${Finora.money(x.tax)}</strong></div>
  <div style="display: flex; justify-content: space-between; padding: 10px 0; border-top: 2px solid #000; font-size: 18px; margin-top: 4px;"><span>جمع مبلغ قابل پرداخت:</span><strong>${Finora.money(x.total)}</strong></div>
  </div>
  </section>

  <div style="display:flex; justify-content:space-between; margin-top:40px; padding: 0 60px; font-size: 16px;">
  <div>مهر و امضای فروشنده</div><div>مهر و امضای خریدار</div>
  </div>`;
}

function renderUnofficial() {
  let rowsHtml = (x.items||[]).map((i,n)=>`<tr>
  <td>${n+1}</td>
  <td>${Finora.escape(i.description)}</td>
  <td>${Finora.escape(i.unit||'عدد')}</td>
  <td>${i.quantity}</td>
  <td>${Finora.money(i.unitPrice)}</td>
  <td>${Finora.money(i.total)}</td>
  </tr>`).join('');
  return `<header style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--line); padding-bottom: 12px; margin-bottom: 16px;">
  <div style="font-size: 10px; color: #666; writing-mode: vertical-rl; text-orientation: mixed;">${Finora.escape(seller?.businessName||'FINORA')}</div>
  <h1 style="margin: 0; font-size: 24px; text-align: center; flex: 1;">فاکتور فروش کالا و خدمات</h1>
  <div style="text-align: left; font-size: 14px; min-width: 200px;">
  <div>شماره فاکتور: <strong>${Finora.escape(x.invoiceNumber||'پیش‌نویس')}</strong></div>
  <div style="margin-top: 4px;">تاریخ صدور: <strong>${Finora.escape(x.issueDate)}</strong></div>
  </div>
  </header>

  <section style="display: flex; gap: 16px; margin-bottom: 16px;">
  <div style="flex: 1; border: 1px solid var(--line); padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.8;">
  <div style="margin-bottom: 4px;"><small class="muted">فروشنده:</small> <strong>${Finora.escape(seller?.businessName||'')}</strong></div>
  <div>شناسه ملی: ${Finora.escape(seller?.nationalId||'')} | کد اقتصادی: ${Finora.escape(seller?.economicCode||'')} | شماره ثبت: ${Finora.escape(seller?.registrationNumber||'')} | کد پستی: ${Finora.escape(seller?.postalCode||'')}</div>
  <div>تلفن: ${Finora.escape(seller?.phone||'')} | نشانی: ${Finora.escape(seller?.address||'')}</div>
  </div>
  <div style="flex: 1; border: 1px solid var(--line); padding: 12px; border-radius: 8px; font-size: 13px; line-height: 1.8;">
  <div style="margin-bottom: 4px;"><small class="muted">خریدار:</small> <strong>${Finora.escape(x.customerName)}</strong></div>
  <div>شناسه ملی: ${Finora.escape(x.customerNationalId||'')} | کد اقتصادی: ${Finora.escape(customer?.economicCode||'')} | شماره ثبت: ${Finora.escape(customer?.registrationNumber||'')} | کد پستی: ${Finora.escape(customer?.postalCode||'')}</div>
  <div>تلفن: ${Finora.escape(customer?.phone||'')} | نشانی: ${Finora.escape(customer?.address||'')}</div>
  </div>
  </section>

  <table class="table" style="margin-bottom: 16px;">
  <thead><tr><th>ردیف</th><th>شرح کالا / خدمات</th><th>واحد</th><th>تعداد</th><th>مبلغ واحد (ریال)</th><th>مبلغ کل (ریال)</th></tr></thead>
  <tbody>${rowsHtml}</tbody>
  </table>

  <section style="display:flex; justify-content:space-between; gap: 16px;">
  <div style="flex:1;">
    <div style="padding:10px; font-size: 13px;">
      <strong>توضیحات:</strong>
      <p style="margin: 8px 0 0 0; white-space: pre-wrap;">${x.notes?Finora.escape(x.notes):'ندارد'}</p>
    </div>
  </div>
  <div style="width: 280px; font-size: 14px;">
  <div style="display: flex; justify-content: space-between; padding: 4px 0;"><span>جمع فاکتور:</span><strong>${Finora.money(x.subtotal)}</strong></div>
  ${x.discountPercent > 0 || x.lineDiscount > 0 ? `<div style="display: flex; justify-content: space-between; padding: 4px 0;"><span>تخفیف:</span><strong>${Finora.money((x.lineDiscount||0)+(x.invoiceDiscountAmount||0))}</strong></div>` : ''}
  ${x.tax > 0 ? `<div style="display: flex; justify-content: space-between; padding: 4px 0;"><span>مالیات:</span><strong>${Finora.money(x.tax)}</strong></div>` : ''}
  <div style="display: flex; justify-content: space-between; padding: 8px 0; border-top: 1px solid var(--ink); font-size: 16px; margin-top: 4px;"><span>مبلغ نهایی:</span><strong>${Finora.money(x.total)}</strong></div>
  </div>
  </section>

  <div style="display:flex; justify-content:space-between; margin-top:48px; padding: 0 60px;" class="muted">
  <div>امضای فروشنده</div><div>امضای خریدار</div>
  </div>`;
}

paper.innerHTML = isOfficial ? renderOfficial() : renderUnofficial();
});</script>
</body>
</html>
