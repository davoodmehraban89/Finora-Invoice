<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>فاکتور | فینورا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;800&display=swap"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body data-print-template-version="2">
<main class="content invoice-preview-content" style="margin:0">
<div class="actions screen-only invoice-preview-actions">
<button class="btn btn-primary" id="outputButton" type="button">خروجی فاکتور</button><a class="btn btn-secondary" id="editLink">ویرایش</a><input class="input" id="paymentInput" type="number" min="0" placeholder="دریافت جدید (ریال)"><button class="btn btn-secondary" id="paymentBtn" type="button">ثبت دریافت</button><button class="btn btn-danger" id="voidBtn" type="button">ابطال فاکتور</button><a class="btn btn-secondary" id="back" href="invoices.html">بازگشت</a>
</div>
<article class="invoice-paper" id="paper"><div class="empty">در حال بارگذاری فاکتور…</div></article>
</main>
<dialog id="outputDialog" class="screen-only"><div class="dialog-card"><div class="dialog-head"><div><h2>نوع خروجی را انتخاب کنید</h2><p class="muted">مرورگر پنجره استاندارد چاپ را باز می‌کند.</p></div><button class="btn btn-secondary" id="closeOutput" type="button">بستن</button></div><div class="choice-grid"><button class="choice-card" id="pdfOutput" type="button"><strong>ذخیره PDF</strong><br><small class="muted">در پنجره بعدی مقصد «Save as PDF» را انتخاب کنید.</small></button><button class="choice-card" id="printerOutput" type="button"><strong>چاپ با چاپگر</strong><br><small class="muted">چاپگر و کاغذ A4 را انتخاب کنید.</small></button></div></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/invoice-core.js"></script><script src="assets/js/app.js"></script>
<script>
Finora.requireAuth(async()=>{'use strict';
const byId=id=>document.getElementById(id),back=byId('back'),editLink=byId('editLink'),paymentButton=byId('paymentBtn'),voidButton=byId('voidBtn'),paymentInput=byId('paymentInput'),paper=byId('paper'),outputButton=byId('outputButton'),outputDialog=byId('outputDialog'),maxSinglePageLines=15;let invoice=null;
outputButton.onclick=()=>outputDialog.showModal();byId('closeOutput').onclick=()=>outputDialog.close();
const openPrintDialog=mode=>{outputDialog.close();const originalTitle=document.title;if(mode==='pdf')document.title=`Finora-${String(invoice?.invoiceNumber||'Invoice').replace(/[^\p{L}\p{N}._-]+/gu,'-')}`;window.addEventListener('afterprint',()=>{document.title=originalTitle},{once:true});window.print()};
byId('pdfOutput').onclick=()=>openPrintDialog('pdf');byId('printerOutput').onclick=()=>openPrintDialog('printer');if(Finora.demo)back.href='invoices.html?demo=1';
const id=new URLSearchParams(location.search).get('id');invoice=await Finora.get('invoices',id);if(!invoice){paper.innerHTML='<div class="empty">فاکتور یافت نشد.</div>';paymentButton.disabled=true;voidButton.disabled=true;outputButton.disabled=true;return}
const [seller,customer]=await Promise.all([Finora.get('settings','seller'),invoice.customerId?Finora.get('customers',invoice.customerId):null]);const taxContext=FinoraInvoice.taxContext(invoice),official=taxContext.invoiceType==='official',payment=FinoraInvoice.paymentStatus(invoice.total,invoice.paidAmount),documentState=FinoraInvoice.documentStatus(invoice),lineCount=(invoice.items||[]).length;
paper.classList.add(official?'invoice-official':'invoice-ordinary',lineCount>12?'print-density-tight':lineCount>8?'print-density-compact':'print-density-standard');paper.dataset.printLineCount=String(lineCount);editLink.href=`new-invoice.html?id=${id}${Finora.demo?'&demo=1':''}`;const defaultOutput=seller?.defaultOutputMode==='pdf'?'pdfOutput':'printerOutput';byId(defaultOutput).insertAdjacentHTML('afterbegin','<span class="badge badge-paid">پیش‌فرض</span><br>');if(lineCount>maxSinglePageLines){outputButton.disabled=true;paper.insertAdjacentHTML('beforebegin',`<div class="notice notice-error screen-only print-limit-notice">برای چاپ تک‌صفحه، حداکثر ${Finora.escape(maxSinglePageLines)} ردیف مجاز است. این فاکتور ${Finora.escape(lineCount)} ردیف دارد؛ ابتدا آن را ویرایش کنید.</div>`)}
paymentButton.onclick=async()=>{const amount=Number(paymentInput.value)||0;if(amount<=0){alert('مبلغ دریافت را وارد کنید.');paymentInput.focus();return}paymentButton.disabled=true;try{await Finora.saveInvoice({...invoice,paidAmount:(Number(invoice.paidAmount)||0)+amount});location.reload()}catch(error){alert(`ثبت دریافت انجام نشد: ${error.message||'خطا'}`);paymentButton.disabled=false}};
voidButton.onclick=async()=>{if(!confirm('فاکتور ابطال شود؟'))return;voidButton.disabled=true;try{await Finora.saveInvoice({...invoice,documentStatus:'void',voidedAt:new Date().toISOString()});location.reload()}catch(error){alert(`ابطال فاکتور انجام نشد: ${error.message||'خطا'}`);voidButton.disabled=false}};
const val=value=>Finora.escape(value||'—'),field=(label,value,wide=false)=>`<div class="legal-field${wide?' wide':''}"><span>${label}</span><strong>${val(value)}</strong></div>`;
const partySection=official?`<section class="official-parties"><div class="legal-party"><h2>مشخصات فروشنده</h2><div class="legal-field-grid">${field('نام / عنوان',seller?.businessName)}${field('شناسه ملی / کد ملی',seller?.nationalId)}${field('شماره اقتصادی',seller?.economicCode)}${field('شماره ثبت',seller?.registrationNumber)}${field('تلفن',seller?.phone)}${field('کد پستی',seller?.postalCode)}${field('نشانی',[seller?.province,seller?.city,seller?.address].filter(Boolean).join('، '),true)}</div></div><div class="legal-party"><h2>مشخصات خریدار</h2><div class="legal-field-grid">${field('نام / عنوان',invoice.customerName)}${field('شناسه ملی / کد ملی',invoice.customerNationalId)}${field('نوع شخص',customer?.type==='person'?'حقیقی':customer?.type==='legal'?'حقوقی':'—')}${field('تلفن',customer?.phone)}${field('ایمیل',customer?.email)}${field('کد پستی','—')}${field('نشانی',customer?.address,true)}</div></div></section>`:`<section class="ordinary-parties"><div><span>فروشنده</span><strong>${val(seller?.businessName)}</strong><small>${val(seller?.phone)}</small></div><div><span>خریدار</span><strong>${val(invoice.customerName)}</strong><small>${val(invoice.customerNationalId)}</small></div><div><span>نشانی / تماس فروشنده</span><strong>${val([seller?.city,seller?.address].filter(Boolean).join('، '))}</strong></div></section>`;
paper.innerHTML=`<header class="invoice-document-head"><div class="invoice-brand"><div class="eyebrow">FINORA</div><h1>${official?'صورتحساب رسمی فروش کالا و خدمات':'فاکتور فروش'}</h1><p>${official?'سند دارای مشخصات قانونی طرفین':'سند تجاری فروش و مطالبه'}</p></div><div class="invoice-number-box"><span>شماره فاکتور</span><strong>${val(invoice.invoiceNumber||'پیش‌نویس')}</strong><span class="badge badge-${documentState.code}">${documentState.label}</span></div></header><section class="invoice-document-meta"><div><span>تاریخ صدور</span><strong>${val(invoice.issueDate)}</strong></div><div><span>تاریخ سررسید</span><strong>${val(invoice.dueDate)}</strong></div><div><span>نوع سند</span><strong>${taxContext.invoiceTypeLabel}</strong></div><div><span>وضعیت مالیات</span><strong>${taxContext.vatModeLabel}${taxContext.vatMode==='included'?` (${taxContext.vatRate}٪)`:''}</strong></div></section>${partySection}<section class="invoice-lines"><table class="table"><thead><tr><th>ردیف</th><th>شرح کالا / خدمت</th><th>تعداد</th><th>فی (ریال)</th><th>تخفیف</th><th>مالیات</th><th>جمع (ریال)</th></tr></thead><tbody>${(invoice.items||[]).map((item,index)=>`<tr><td>${index+1}</td><td>${val(item.description)}</td><td>${item.quantity}</td><td>${Finora.money(item.unitPrice)}</td><td>${Finora.money(item.discount)}</td><td>${Finora.money(item.tax)}</td><td>${Finora.money(item.total)}</td></tr>`).join('')}</tbody></table></section><section class="invoice-closing"><div class="invoice-notes"><h3>توضیحات و شرایط پرداخت</h3><p>${val(invoice.notes||seller?.invoiceFooter||'—')}</p><div class="signature-row"><span>مهر و امضای فروشنده</span><span>مهر و امضای خریدار</span></div></div><div class="invoice-totals"><div><span>جمع ناخالص</span><strong>${Finora.money(invoice.subtotal)}</strong></div><div><span>تخفیف</span><strong>${Finora.money((invoice.lineDiscount||0)+(invoice.invoiceDiscountAmount||0))}</strong></div><div><span>${taxContext.vatMode==='included'?`ارزش افزوده ${taxContext.vatRate}٪`:'ارزش افزوده'}</span><strong>${Finora.money(invoice.tax)}</strong></div><div class="grand-total"><span>مبلغ نهایی</span><strong>${Finora.money(invoice.total)}</strong></div><div><span>دریافتی</span><strong>${Finora.money(invoice.paidAmount)}</strong></div><div><span>مانده</span><strong>${Finora.money(payment.balance)}</strong></div></div></section><footer class="invoice-document-footer"><span>${official?'انتخاب عنوان رسمی به‌تنهایی به معنی ارسال یا تأیید در سامانه مؤدیان نیست.':'این فاکتور عادی است و جایگزین صورتحساب الکترونیکی رسمی نیست.'}</span>${invoice.taxRuleVersion?`<span>پروفایل مالیاتی: ${val(invoice.taxRuleVersion)} • سال ${val(invoice.taxYear)}</span>`:''}</footer>`;
});
</script>
</body></html>
