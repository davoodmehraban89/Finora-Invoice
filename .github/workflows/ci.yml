name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - name: Validate required application files
        run: |
          test -s index.html
          test -s supabase/migrations/202608280001_invoice_phase.sql
          test -s supabase/migrations/202608310001_invoice_tax_context.sql
          test -s assets/js/app.js
          test -s assets/js/invoice-core.js
          test -s assets/js/tax-rules.js
