name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/*.test.js
      - name: Install print verification tools
        run: |
          npm install --no-save --package-lock=false playwright@1.51.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y poppler-utils
      - name: Verify rendered landscape invoices
        run: |
          python3 -m http.server 4173 > /tmp/finora-http.log 2>&1 &
          node tests/browser-uat.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: landscape-print-evidence
          path: .uat-evidence/
      - name: Validate required application files
        run: |
          test -s index.html
          test -s assets/js/app.js
          test -s assets/js/invoice-core.js
          test -s assets/js/supabase-config.js
          test -s assets/js/tax-rules.js
          test -s supabase/migrations/202608280001_invoice_phase.sql
          test -s supabase/migrations/202608310001_invoice_tax_context.sql
          test -s supabase/migrations/202608310002_invoice_settings_numbering.sql
          test -s supabase/migrations/202609010003_invoice_completion_snapshots.sql
          test -s supabase/migrations/20260913212458_harden_invoice_snapshot_trigger.sql
          test -s wrangler.jsonc
