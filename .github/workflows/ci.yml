name: Finora CI & Quality Assurance Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

jobs:
  test:
    name: Automated Invariant & Domain Tests (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Display Environment Info
        run: |
          node -v
          npm -v

      - name: Run Financial Invariant Tests (Chapters 021, 045, 141, 242, 252)
        run: node --test tests/financial-invariants.test.js

      - name: Run Accounting Posting & GL Tests (Chapters 021, 045, 062, 241)
        run: node --test tests/accounting-posting.test.js

      - name: Run Versioned Tax & Moadian E-Invoice Tests (Chapters 016, 017, 031, 046, 232, 233)
        run: node --test tests/tax-engine-versioning.test.js

      - name: Run Multi-Tenant RLS Isolation Tests (Chapters 008, 009, 027, 057, 137, 234, 250)
        run: node --test tests/multi-tenant-rls.test.js

      - name: Run Full Invoicing Lifecycle Tests (Chapters 013, 014, 016, 045)
        run: node --test tests/invoice-lifecycle.test.js

      - name: Run Contracts, Stock & Treasury Tests (Chapters 012, 015, 020, 032, 238)
        run: node --test tests/contract-governance.test.js

      - name: Run Frontend Client Bridge Integration Tests (Chapters 006, 007, 013, 014)
        run: node --test tests/frontend-integration.test.js

      - name: Run All Test Suites Aggregated
        run: npm test

      - name: Validate 260-Chapter Completion Register
        run: npm run validate:matrix
