<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | فینورا ERP</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body><main class="login"><section class="login-card"><div class="eyebrow">FINORA ERP</div><h1 style="font-size: 24px; margin-bottom: 8px;">فینورا؛ نرم‌افزار جامع حسابداری</h1><p class="muted" style="margin-top: 0; margin-bottom: 24px;">ورود به حساب کاربری سازمانی</p><div id="message" class="notice" hidden></div><form id="loginForm"><div class="field"><label for="email">ایمیل</label><input class="input" id="email" type="email" autocomplete="username" required></div><div class="field" style="margin-top:14px"><label for="password">رمز عبور</label><input class="input" id="password" type="password" autocomplete="current-password" required></div><div class="actions" style="margin-top:24px; display:flex; gap:12px; flex-direction:column;"><button class="btn btn-primary" style="width:100%" type="submit">ورود امن به فینورا</button><button class="btn btn-secondary" style="width:100%" type="button" id="signupBtn">ثبت‌نام سازمانی جدید</button></div></form><div style="margin-top:32px; padding-top:16px; border-top:1px solid #dfe7e4; text-align:center;"><p class="muted" style="font-size:12px; margin-bottom:12px;">آیا می‌خواهید محصول را بررسی کنید؟</p><a class="btn btn-secondary" style="display:inline-block; text-decoration:none;" href="dashboard.html?demo=1">ورود به نسخه نمایشی (آفلاین)</a></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script>const cfg=window.FINORA_SUPABASE_CONFIG,client=supabase.createClient(cfg.url,cfg.publishableKey),form=document.querySelector('#loginForm'),msg=document.querySelector('#message');function show(text,isErr=true){msg.hidden=false;msg.textContent=text;msg.className=isErr?'notice notice-error':'notice';}form.addEventListener('submit',async e=>{e.preventDefault();msg.hidden=true;const button=form.querySelector('button[type="submit"]');button.disabled=true;button.textContent='در حال ورود...';const{error}=await client.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(error){show('ورود انجام نشد. ایمیل و رمز عبور را بررسی کنید.');button.disabled=false;button.textContent='ورود امن به فینورا';}else location.href='dashboard.html'});signupBtn.onclick=async()=>{msg.hidden=true;if(!email.value.trim()){return show('لطفا ایمیل را وارد کنید.');}if(password.value.length<8)return show('رمز عبور باید حداقل ۸ نویسه باشد.');signupBtn.disabled=true;signupBtn.textContent='در حال ثبت‌نام...';const{data,error}=await client.auth.signUp({email:email.value.trim(),password:password.value});if(error){show(error.message);signupBtn.disabled=false;signupBtn.textContent='ثبت‌نام سازمانی جدید';return;}show(data.session?'حساب ساخته شد؛ در حال ورود…':'حساب ساخته شد. لطفاً ایمیل تأیید را باز کنید و سپس وارد شوید.',false);if(data.session)setTimeout(()=>location.href='dashboard.html',700);else{signupBtn.disabled=false;signupBtn.textContent='ثبت‌نام سازمانی جدید';}};client.auth.getSession().then(({data})=>{if(data.session)location.href='dashboard.html'});</script></body></html>
