<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود | فینورا</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap"><link rel="stylesheet" href="assets/css/app.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body><main class="login"><section class="login-card"><div class="eyebrow">FINORA • INVOICE</div><h1>فروش حرفه‌ای، از صدور تا وصول</h1><p class="muted">فاز نخست فینورا؛ مدیریت امن و یکپارچه فاکتور فروش</p><div id="message" class="notice" hidden></div><form id="loginForm"><div class="field"><label for="email">ایمیل</label><input class="input" id="email" type="email" autocomplete="username" required></div><div class="field" style="margin-top:14px"><label for="password">رمز عبور</label><input class="input" id="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary" style="width:100%;margin-top:20px" type="submit">ورود امن</button><button class="btn btn-secondary" style="width:100%;margin-top:10px" type="button" id="signupBtn">ایجاد حساب کاربری</button></form><a class="btn btn-secondary" style="display:block;text-align:center;text-decoration:none;margin-top:10px" href="dashboard.html?demo=1">مشاهده نسخه نمایشی</a></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="assets/js/supabase-config.js"></script><script src="assets/js/login.js"></script></body></html>
