<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تنظیمات فروشنده | فینورا</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<link rel="stylesheet" href="assets/css/app.css">
<link rel="stylesheet" href="assets/css/mobile.css">
</head>
<body>
<aside class="sidebar">
<div class="brand">فینورا<small>مدیریت فروش تا وصول</small>
</div>
<a class="nav-link" href="dashboard.html">
<span>نمای کلی</span>
</a>
<a class="nav-link" href="new-invoice.html">
<span>صدور فاکتور</span>
</a>
<a class="nav-link" href="invoices.html">
<span>فاکتورها</span>
</a>
<a class="nav-link" href="customers.html">
<span>اشخاص</span>
</a>
<a class="nav-link" href="products.html">
<span>کالا و خدمت</span>
</a>
<a class="nav-link active" href="settings.html">
<span>تنظیمات فروشنده</span>
</a>
</aside>
<main class="content">
<header class="page-head">
<div>
<div class="eyebrow">پیکربندی</div>
<h1>مشخصات فروشنده</h1>
<div class="muted">این اطلاعات در سربرگ فاکتور چاپ می‌شود.</div>
</div>
</header>
<form class="card" id="form" style="max-width:900px">
<div id="message" class="notice" hidden>
</div>
<div class="form-grid">
<div class="field">
<label>نام تجاری/شخص *</label>
<input class="input" id="businessName" required maxlength="160">
</div>
<div class="field">
<label>شناسه/کد ملی</label>
<input class="input" id="nationalId" maxlength="30">
</div>
<div class="field">
<label>شماره اقتصادی</label>
<input class="input" id="economicCode" maxlength="30">
</div>
<div class="field">
<label>تلفن</label>
<input class="input" id="phone" maxlength="30">
</div>
<div class="field">
<label>ایمیل</label>
<input class="input" id="email" type="email">
</div>
<div class="field">
<label>شماره شبا/حساب</label>
<input class="input" id="bankAccount" maxlength="60">
</div>
<div class="field" style="grid-column:span 2">
<label>نشانی</label>
<textarea class="textarea" id="address" rows="3">
</textarea>
</div>
</div>
<button class="btn btn-primary" id="saveSettings" style="margin-top:18px" type="submit">ذخیره تنظیمات</button>
</form>
</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
</script>
<script src="assets/js/supabase-config.js">
</script>
<script src="assets/js/app.js">
</script>
<script>(()=>{'use strict';const byId=id=>document.getElementById(id),form=byId('form'),message=byId('message'),button=byId('saveSettings'),businessName=byId('businessName'),nationalId=byId('nationalId'),economicCode=byId('economicCode'),phone=byId('phone'),email=byId('email'),bankAccount=byId('bankAccount'),address=byId('address');let profile=null;function fill(x){businessName.value=x?.businessName||'';nationalId.value=x?.nationalId||'';economicCode.value=x?.economicCode||'';phone.value=x?.phone||'';email.value=x?.email||'';bankAccount.value=x?.bankAccount||'';address.value=x?.address||''}function notify(text,error=false){message.hidden=false;message.textContent=text;message.classList.toggle('notice-error',error)}form.addEventListener('submit',async event=>{event.preventDefault();if(!businessName.value.trim()){notify('نام تجاری یا نام شخص را وارد کنید.',true);businessName.focus();return}button.disabled=true;button.textContent='در حال ذخیره…';try{profile=await Finora.save('settings',{id:'seller',businessName:businessName.value.trim(),nationalId:nationalId.value.trim(),economicCode:economicCode.value.trim(),phone:phone.value.trim(),email:email.value.trim(),bankAccount:bankAccount.value.trim(),address:address.value.trim()});notify('تنظیمات فروشنده ذخیره شد.')}catch(error){notify(`ذخیره تنظیمات انجام نشد: ${error.message||'خطا'}`,true)}finally{button.disabled=false;button.textContent='ذخیره تنظیمات'}});Finora.requireAuth(async()=>{profile=await Finora.get('settings','seller');fill(profile)});})();</script>
</body>
</html>
